name: CI

on:
  push:
    branches: [main, 'claude/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full SHA to prevent tag-repointing supply chain attacks.
      # Verify or update these SHAs at: https://github.com/actions/checkout/tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # Verify or update at: https://github.com/actions/setup-node/tags
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Generate crawler snapshots
        run: npm run generate:crawler-html

      - name: Validate crawler output
        run: npm run validate:crawler

      - name: Secret scan (gitleaks)
        # Pinned to full SHA to prevent tag-repointing supply chain attacks.
        # Verify or update at: https://github.com/gitleaks/gitleaks-action/tags
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Key Audit
        run: |
          if grep -r "GEMINI_API_KEY" dist/; then
            echo "ERROR: GEMINI_API_KEY found in bundle"
            exit 1
          fi

  project-visual-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Review project entries
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/portfolio-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/projects/hps-geospatial > /dev/null; then break; fi
            sleep 1
          done
          node scripts/review-project-visuals.mjs
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-visual-review
          path: visual-review/
          if-no-files-found: warn
